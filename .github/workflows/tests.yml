name: Tests

on: [push, pull_request]

jobs:
  nrsa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"
      - run: Rscript -e 'install.packages("survey", repos = "https://cloud.r-project.org")'
      - run: Rscript tests/test_nrsa.R
      - run: python fetch_nrsa.py
      - run: Rscript analyze.R
      - run: Rscript report_tables.R
      - run: quarto render report.qmd
